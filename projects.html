    <!-- ===== Header and navigation (identical on every page) ===== -->

        <nav class="navbar">
            <div class="navbar-container">
                <a class="navbar-brand" href="index.html">

                </ul>
            </div>
        </nav>

    <main>
        <section class="projects-page">
            <h1>Projects</h1>
            <p class="projects-intro">A selection of things I have built. Use the filters to narrow them down by
                technology.</p>

            <!-- ===== Filter buttons: JS reads data-filter and compares it to each card's data-category ===== -->
            <div class="filter-bar" role="group" aria-label="Filter projects by technology">
                <button class="filter-btn active" type="button" data-filter="all" aria-pressed="true">All</button>

                <button class="filter-btn" type="button" data-filter="java" aria-pressed="false">Java</button>

                <button class="filter-btn" type="button" data-filter="javascript"
                    aria-pressed="false">JavaScript</button>

                <button class="filter-btn" type="button" data-filter="html-css" aria-pressed="false">HTML/CSS</button>

                <button class="filter-btn" type="button" data-filter="python" aria-pressed="false">Python</button>

                <button class="filter-btn" type="button" data-filter="fintech" aria-pressed="false">Fintech</button>

                <button class="filter-btn" type="button" data-filter="telecom" aria-pressed="false">Telecom</button>

                <button class="filter-btn" type="button" data-filter="robotics" aria-pressed="false">Robotics</button>
            </div>


            <!-- Announces the result of a filter to screen readers -->
            <p class="filter-status" id="filter-status" aria-live="polite"></p>

            <!-- ===== Cards are inserted here by scripts/projects.js (CSS Grid container) ===== -->
            <div id="project-container"></div>
        </section>
    </main>

    <!-- ===== Card template: one copy of this structure is cloned for every project ===== -->
    <template id="project-template">
        <div class="project-card" data-category="">
            <img class="project-image" data-field="image" src="" alt="">

            <div class="project-body">
                <h2 class="project-title" data-field="title">Project title</h2>

                <p class="project-date">Completed: <time data-field="date">Month Year</time></p>

                <p class="project-description" data-field="description">Short description of the project.</p>

                <ul class="project-tech" data-field="tech" aria-label="Technologies used">
                    <li class="tech-chip">Technology</li>
                </ul>

                <a class="project-link" data-field="link" href="#" target="_blank" rel="noopener">View on GitHub</a>
            </div>
        </div>
    </template>
