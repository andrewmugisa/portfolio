<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Andrew Mugisa</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- ===== Header and navigation (identical on every page) ===== -->
    <header>
        <nav class="navbar">
            <div class="navbar-container">
                <a class="navbar-brand" href="index.html">
                    <img src="images/logo.jpeg" alt="Andrew Mugisa logo" class="navbar-logo">
                </a>

                <ul class="navbar-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="resume.html">Resume</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main id="main">
        <h1 class="page-title">Contact</h1>
        <p class="page-intro">Have a question or an opportunity? Send me a message, or email me directly at <a
                class="text-link" href="mailto:andr0395@algonquinlive.com">andr0395@algonquinlive.com</a>.</p>

        <form class="contact-form" id="contact-form" action="mailto:andr0395@algonquinlive.com" method="post"
            novalidate>
            <div class="form-field">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" autocomplete="name" required>
                <p class="error" id="name-error" aria-live="polite"></p>
            </div>

            <div class="form-field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
                <p class="error" id="email-error" aria-live="polite"></p>
            </div>

            <div class="form-field">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" minlength="5" maxlength="100" required>
                <p class="hint"><span id="subject-count">0</span>/100 (minimum 5)</p>
                <p class="error" id="subject-error" aria-live="polite"></p>
            </div>

            <div class="form-field">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" minlength="20" maxlength="500" required></textarea>
                <p class="hint"><span id="message-count">0</span>/500 (minimum 20)</p>
                <p class="error" id="message-error" aria-live="polite"></p>
            </div>

            <button class="btn btn-primary" type="submit">Submit</button>
            <p class="form-success" id="form-success" role="status"></p>
        </form>
    </main>

    <!-- ===== Footer (identical on every page) ===== -->
    <footer>
        <p>&copy; 2026 Andrew Mugisa. All rights reserved.</p>
    </footer>

    <script src="scripts/contact.js"></script>
</body>

</html>
